[package]
name = "rust-vpn-splitter"
version = "0.1.0"
edition = "2024"
description = "A small Windows GUI for assigning IPv4 destination networks to enterprise VPN adapters."
license = "MIT"
build = "build.rs"

[dependencies]
eframe = "0.35.0"
ipnet = { version = "2.12.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
